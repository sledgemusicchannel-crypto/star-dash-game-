<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Star Dash Adventure</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    #gameContainer { position: relative; width: 100%; max-width: 480px; height: 100vh; max-height: 800px; background: #1e293b; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    canvas { display: block; width: 100%; height: 100%; }
    
    /* UI Overlay */
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.85); color: #fff; z-index: 10; padding: 20px; text-align: center; }
    .hidden { display: none !important; }
    h1 { font-size: 2.2rem; color: #facc15; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    p { font-size: 1.1rem; color: #cbd5e1; margin-bottom: 25px; }
    
    /* Kid-Friendly Buttons */
    .btn { background: #3b82f6; color: white; border: none; padding: 16px 32px; font-size: 1.3rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #1d4ed8, 0 10px 15px rgba(0,0,0,0.3); transition: transform 0.1s; margin: 8px 0; width: 80%; }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1d4ed8; }
    .btn-reward { background: #10b981; box-shadow: 0 6px 0 #047857; }
    .btn-reward:active { box-shadow: 0 2px 0 #047857; }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
      <h1>⭐ STAR DASH ⭐</h1>
      <p>Tap anywhere to jump & avoid the spikes!</p>
      <button class="btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <!-- Game Over Screen (With Ad Integration Hooks) -->
    <div id="gameOverScreen" class="overlay hidden">
      <h1>GAME OVER</h1>
      <p id="finalScore">Stars Collected: 0</p>
      
      <!-- Rewarded Ad Revive Button -->
      <button class="btn btn-reward" onclick="watchAdToRevive()">🎬 WATCH AD TO CONTINUE</button>
      
      <!-- Regular Restart (Triggers Interstitial Ad) -->
      <button class="btn" onclick="restartGameWithAd()">RESTART</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('gameContainer');

// Canvas Auto-Resizing
function resize() {
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// Game State Variables
let gameState = 'START';
let score = 0;
let runSpeed = 5;
let gravity = 0.6;
let frameCount = 0;
let deathCount = 0; // Tracks game overs for ad cadence

// Game Entities
let hero = { x: 50, y: 0, width: 40, height: 40, dy: 0, jumpForce: -13, grounded: false };
let obstacles = [];
let stars = [];
let particles = [];

// Ground settings
const groundY = () => canvas.height - 80;

function resetPlayer() {
  hero.y = groundY() - hero.height;
  hero.dy = 0;
}

// Input Handlers (Tap / Key press to jump)
function handleJump() {
  if (gameState === 'PLAYING' && hero.grounded) {
    hero.dy = hero.jumpForce;
    hero.grounded = false;
    createParticles(hero.x + hero.width/2, hero.y + hero.height, '#facc15', 8);
  }
}
window.addEventListener('touchstart', (e) => { if(e.target.tagName !== 'BUTTON') handleJump(); });
window.addEventListener('mousedown', (e) => { if(e.target.tagName !== 'BUTTON') handleJump(); });
window.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp') handleJump(); });

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  score = 0;
  runSpeed = 5;
  obstacles = [];
  stars = [];
  particles = [];
  resetPlayer();
  gameState = 'PLAYING';
}

function createParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      dx: (Math.random() - 0.5) * 6,
      dy: (Math.random() - 0.5) * 6,
      radius: Math.random() * 4 + 2,
      color,
      life: 20
    });
  }
}

// Main Game Loop
function update() {
  if (gameState !== 'PLAYING') return;

  frameCount++;
  runSpeed = 5 + Math.floor(score / 10) * 0.5; // Gradually speeds up

  // Apply Hero Gravity & Physics
  hero.dy += gravity;
  hero.y += hero.dy;

  if (hero.y + hero.height >= groundY()) {
    hero.y = groundY() - hero.height;
    hero.dy = 0;
    hero.grounded = true;
  }

  // Spawn Obstacles (Red Spikes)
  if (frameCount % Math.max(60, 120 - Math.floor(runSpeed * 4)) === 0) {
    obstacles.push({ x: canvas.width, y: groundY() - 35, width: 35, height: 35 });
  }

  // Spawn Stars (Collectible Items)
  if (frameCount % 90 === 0) {
    stars.push({ x: canvas.width, y: groundY() - 70 - Math.random() * 80, radius: 15 });
  }

  // Update & Check Obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].x -= runSpeed;

    // Collision Detection
    if (
      hero.x < obstacles[i].x + obstacles[i].width &&
      hero.x + hero.width > obstacles[i].x &&
      hero.y < obstacles[i].y + obstacles[i].height &&
      hero.y + hero.height > obstacles[i].y
    ) {
      triggerGameOver();
    }

    if (obstacles[i].x + obstacles[i].width < 0) obstacles.splice(i, 1);
  }

  // Update & Check Collectible Stars
  for (let i = stars.length - 1; i >= 0; i--) {
    stars[i].x -= runSpeed;

    let dist = Math.hypot((hero.x + hero.width/2) - stars[i].x, (hero.y + hero.height/2) - stars[i].y);
    if (dist < hero.width/2 + stars[i].radius) {
      score++;
      createParticles(stars[i].x, stars[i].y, '#facc15', 10);
      stars.splice(i, 1);
    } else if (stars[i].x < -20) {
      stars.splice(i, 1);
    }
  }

  // Update Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].x += particles[i].dx;
    particles[i].y += particles[i].dy;
    particles[i].life--;
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
}

// Rendering Function
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Draw Sky Background
  let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0f172a');
  grad.addColorStop(1, '#1e293b');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 2. Draw Ground
  ctx.fillStyle = '#10b981';
  ctx.fillRect(0, groundY(), canvas.width, canvas.height - groundY());

  if (gameState === 'PLAYING') {
    // 3. Draw Hero (Vibrant Blue Square with Mascot Face)
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath();
    ctx.roundRect(hero.x, hero.y, hero.width, hero.height, 8);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(hero.x + 24, hero.y + 8, 8, 8);
    ctx.fillStyle = '#000000';
    ctx.fillRect(hero.x + 28, hero.y + 10, 4, 4);

    // 4. Draw Spikes (Red Triangles)
    ctx.fillStyle = '#ef4444';
    obstacles.forEach(obs => {
      ctx.beginPath();
      ctx.moveTo(obs.x, obs.y + obs.height);
      ctx.lineTo(obs.x + obs.width / 2, obs.y);
      ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
      ctx.closePath();
      ctx.fill();
    });

    // 5. Draw Collectible Stars (Yellow Circles)
    ctx.fillStyle = '#facc15';
    stars.forEach(star => {
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
      ctx.fill();
    });

    // 6. Draw Particle Effects
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    });

    // 7. Draw Score UI
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText(`⭐ Stars: ${score}`, 20, 40);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();

// --- AD INTEGRATION & GAME OVER HOOKS ---

function triggerGameOver() {
  gameState = 'GAMEOVER';
  deathCount++;
  document.getElementById('finalScore').innerText = `Stars Collected: ${score}`;
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

function restartGameWithAd() {
  // Trigger Interstitial Ad every 2 deaths to respect Google Play Families Policy
  if (deathCount % 2 === 0) {
    console.log("Trigger AdMob Interstitial Ad here");
    // WebIntoApp Android wrapper automatically handles interstitial triggers if configured!
  }
  startGame();
}

function watchAdToRevive() {
  console.log("Trigger AdMob Rewarded Video Ad here");
  // Simulating rewarded ad completion:
  alert("Reward Granted! Continuing run...");
  document.getElementById('gameOverScreen').classList.add('hidden');
  resetPlayer();
  obstacles = []; // Clear obstacles in front of player
  gameState = 'PLAYING';
}
</script>
</body>
</html>
